# Fork-only workflow (izerok/nanoMuse-unofficial): builds the self-hosted relay image
# from cloud/Dockerfile and pushes it to GHCR. Upstream has no relay image
# workflow (its docker.yml builds the runtime only). Triggered on cloud/
# changes, on edits to this file, or manually.
name: Relay image

on:
  push:
    branches: [main]
    paths:
      - "cloud/**"
      - ".github/workflows/relay-docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: build and push relay
    runs-on: ubuntu-latest
    # two multi-arch images, the arm64 half under QEMU: about ten minutes, rarely twenty
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/nanomuse-relay
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=main-,format=short
          labels: |
            org.opencontainers.image.title=nanoMuse relay
            org.opencontainers.image.description=Self-hosted nanoMuse relay (cloud/) from the izerok/nanoMuse-unofficial fork: sign-in, device discovery, sync and the OpenAI-shaped proxy. Bring your own provider key.
            org.opencontainers.image.source=https://github.com/izerok/nanoMuse-unofficial
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./cloud
          file: ./cloud/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
